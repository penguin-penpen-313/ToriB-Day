<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: #FFFDE8;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }

  /* ── Animated gradient background ── */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    transition: background 1.0s ease;
  }
  .bg-0 { background: linear-gradient(155deg, #FFFDE8 0%, #FEF0A8 38%, #F8D5DC 70%, #FEEFD0 100%); }
  .bg-1 { background: linear-gradient(160deg, #FEF8D0 0%, #F5C6D0 50%, #B8E0EE 100%); }
  .bg-2 { background: linear-gradient(155deg, #FFFDE8 0%, #FAE566 40%, #F5C6D0 100%); }
  .bg-3 { background: linear-gradient(158deg, #F0F9FF 0%, #B8DCEC 42%, #F5C6D0 100%); }
  .bg-4 { background: linear-gradient(155deg, #FEF8D0 0%, #FFFDE8 42%, #FAE566 100%); }
  .bg-5 { background: linear-gradient(160deg, #FEF8D0 0%, #FAE566 45%, #F5C6D0 100%); }
  .bg-close { background: linear-gradient(155deg, #FFFDE8 0%, #FEF0A8 45%, #B8DCEC 100%); }

  /* ── Floating decorations ── */
  #deco { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .deco-item {
    position: absolute;
    font-size: 14px;
    opacity: 0;
    animation: floatUp linear infinite;
    pointer-events: none;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.8); }
    8%   { opacity: 0.65; }
    90%  { opacity: 0.55; }
    100% { opacity: 0; transform: translateY(-110px) rotate(220deg) scale(1.1); }
  }

  /* ── Loading screen ── */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: linear-gradient(155deg, #FFFDE8 0%, #FEF0A8 38%, #F8D5DC 100%);
  }
  .loading-icon { font-size: 52px; animation: loadBounce 1.2s ease-in-out infinite; }
  @keyframes loadBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .loading-text {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 17px; font-weight: 700;
    color: #A07008; letter-spacing: 0.12em;
    animation: loadPulse 1.4s steps(2) infinite;
  }
  @keyframes loadPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ── Error screen ── */
  #error-screen {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #FFFDE8; padding: 32px; text-align: center;
  }
  #error-screen .err-icon { font-size: 42px; }
  #error-screen .err-msg { font-size: 15px; color: #888; line-height: 1.7; }
  .err-retry {
    margin-top: 8px; padding: 12px 28px;
    background: #D4960C; color: #fff; border: none;
    border-radius: 999px; font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }

  /* ── Slides container ── */
  #slides-container {
    position: fixed; inset: 0; z-index: 2;
    display: none;
  }

  /* ── Individual slide ── */
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px 80px; /* bottom padding for nav bar */
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    overflow-y: auto;
  }
  .slide.active { opacity: 1; pointer-events: auto; }

  .slide-inner {
    width: 100%; max-width: 420px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 0;
  }
  .slide.active .slide-inner {
    animation: contentRise 0.5s ease both 0.15s;
  }
  @keyframes contentRise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ────────────────────────── TITLE SLIDE ── */
  .title-slide { gap: 0; }

  .title-badge {
    display: inline-block;
    background: rgba(212, 150, 12, 0.14);
    border: 1.5px solid rgba(212, 150, 12, 0.4);
    border-radius: 999px;
    padding: 5px 18px;
    font-size: 12px; font-weight: 700;
    color: #A07008; letter-spacing: 0.2em;
    margin-bottom: 22px;
  }

  .title-big-icon { font-size: 72px; margin-bottom: 18px; line-height: 1; }

  .title-main {
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 900; line-height: 1.15;
    color: #2C3E50; margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  .title-main .accent { color: #D4960C; }

  .title-name {
    font-size: clamp(22px, 6vw, 28px); font-weight: 700;
    color: #4A5568; margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  .title-divider {
    width: 48px; height: 3px;
    background: linear-gradient(90deg, #FAE566, #D4960C, #FAE566);
    border-radius: 2px; margin: 0 auto 22px;
  }

  .title-body {
    font-size: 17px; font-weight: 400;
    color: #4A5568; line-height: 1.9;
    margin-bottom: 36px;
  }

  .title-tap {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: #A07008;
    letter-spacing: 0.12em;
    opacity: 0.7; animation: tapPulse 2s ease-in-out infinite;
  }
  @keyframes tapPulse { 0%,100%{opacity:.5; transform:translateX(0)} 50%{opacity:1; transform:translateX(5px)} }

  /* ────────────────────────── MESSAGE SLIDE ── */
  .msg-slide { gap: 0; }

  .msg-counter {
    font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 600;
    color: rgba(74, 85, 104, 0.55);
    letter-spacing: 0.15em;
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  /* Photo circle */
  .photo-circle {
    width: clamp(110px, 28vw, 140px);
    height: clamp(110px, 28vw, 140px);
    border-radius: 50%;
    overflow: hidden;
    border: 3.5px solid #D4960C;
    box-shadow: 0 8px 28px rgba(212, 150, 12, 0.28), 0 2px 8px rgba(44, 62, 80, 0.1);
    margin-bottom: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #FEF8D0, #F5C6D0);
  }
  .photo-circle img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .photo-circle .no-img-inner {
    font-size: clamp(32px, 8vw, 48px); line-height: 1;
  }

  .msg-from {
    font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 600;
    color: #A07008; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 6px;
  }

  .msg-name {
    font-size: clamp(22px, 6.5vw, 30px); font-weight: 900;
    color: #2C3E50; letter-spacing: 0.04em; margin-bottom: 18px;
    line-height: 1.2;
  }

  .msg-rule {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, transparent, #D4960C, transparent);
    border-radius: 2px; margin: 0 auto 20px;
  }

  .msg-body {
    font-size: clamp(15px, 4.2vw, 18px);
    font-weight: 400; line-height: 2.1;
    color: #4A5568;
    white-space: pre-wrap; word-break: break-word;
    letter-spacing: 0.04em;
    /* Card-like container */
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 4px 16px rgba(44, 62, 80, 0.06);
    text-align: left;
  }

  /* ────────────────────────── CLOSING SLIDE ── */
  .closing-slide { gap: 0; }

  .closing-icon { font-size: 62px; margin-bottom: 20px; line-height: 1; }

  .closing-title {
    font-size: clamp(26px, 7.5vw, 36px); font-weight: 900;
    color: #2C3E50; line-height: 1.5; margin-bottom: 18px;
    letter-spacing: 0.02em;
  }

  .closing-divider {
    width: 48px; height: 3px;
    background: linear-gradient(90deg, #FAE566, #D4960C, #FAE566);
    border-radius: 2px; margin: 0 auto 18px;
  }

  .closing-sub {
    font-size: 17px; font-weight: 700;
    color: #A07008; letter-spacing: 0.08em; margin-bottom: 28px;
  }

  .closing-hearts {
    font-size: 28px; letter-spacing: 10px; line-height: 1;
    margin-bottom: 28px;
  }

  .closing-note {
    font-size: 14px; color: rgba(74, 85, 104, 0.6);
    letter-spacing: 0.08em; font-weight: 400;
  }

  /* ── Navigation tap zones ── */
  .nav-zone {
    position: fixed; top: 0; bottom: 64px;
    width: 50%; z-index: 10; cursor: pointer;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  /* Arrow hints */
  .nav-arrow {
    position: fixed; top: 50%;
    transform: translateY(-50%);
    z-index: 11; pointer-events: none;
    font-size: 22px;
    color: rgba(44, 62, 80, 0.2);
    transition: color 0.2s, opacity 0.2s;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
  }
  .nav-arrow.left  { left: 10px; }
  .nav-arrow.right { right: 10px; }
  .nav-arrow.hidden { opacity: 0; }

  /* Flash on tap */
  .nav-zone:active { background: rgba(212, 150, 12, 0.06); }

  /* ── Bottom bar ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 64px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    gap: 0; flex-direction: column;
    background: rgba(255, 253, 232, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(212, 150, 12, 0.15);
  }

  .dots-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(212, 150, 12, 0.28);
    transition: all 0.3s ease; cursor: pointer;
  }
  .dot.active { background: #D4960C; width: 20px; border-radius: 4px; }
  .dot:hover  { background: rgba(212, 150, 12, 0.55); }

  .counter-text {
    font-family: 'Nunito', sans-serif;
    font-size: 11px; font-weight: 600;
    color: rgba(74, 85, 104, 0.55);
    letter-spacing: 0.2em; text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="bg" class="bg-0"></div>
<div id="deco"></div>

<div id="loading">
  <div class="loading-icon">🎂</div>
  <div class="loading-text">読み込み中…</div>
</div>

<div id="error-screen">
  <div class="err-icon">⚠️</div>
  <div class="err-msg" id="errMsg">データを読み込めませんでした</div>
  <button class="err-retry" onclick="location.reload()">もう一度試す</button>
</div>

<div id="slides-container"></div>

<!-- Navigation -->
<div class="nav-zone left"  onclick="navigate(-1)" id="navL"></div>
<div class="nav-zone right" onclick="navigate(1)"  id="navR"></div>
<div class="nav-arrow left"  id="arrowL">‹</div>
<div class="nav-arrow right" id="arrowR">›</div>

<div class="bottom-bar">
  <div class="dots-row" id="dotsRow"></div>
  <div class="counter-text" id="counterText">01 / 01</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Background themes ──
const BG_THEMES = ['bg-0','bg-1','bg-2','bg-3','bg-4','bg-5'];
const NO_IMG_EMOJIS = ['🐦','🌸','🌟','🎀','🌼','🦋','🌈','✨'];

// ── Decorative floating items ──
const DECO_SYMBOLS = ['✦','·','✿','◦','❋','✧','♡'];
(function spawnDeco() {
  const c = document.getElementById('deco');
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('span');
    el.className = 'deco-item';
    el.textContent = DECO_SYMBOLS[i % DECO_SYMBOLS.length];
    el.style.cssText = `left:${Math.random()*100}%;top:${40 + Math.random()*55}%;`
      + `font-size:${9 + Math.random()*12}px;`
      + `color:rgba(${Math.random()>.5?'212,150,12':'245,198,208'},${0.2+Math.random()*0.3});`
      + `animation-delay:${Math.random()*8}s;animation-duration:${5+Math.random()*5}s;`;
    c.appendChild(el);
  }
})();

// ── Escape HTML ──
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Build slides HTML ──
function buildTitle() {
  return `<div class="slide active" data-idx="0" data-bg="bg-0">
    <div class="slide-inner title-slide">
      <div class="title-badge">Birthday Message</div>
      <div class="title-big-icon">🎂</div>
      <div class="title-main">Happy<br><span class="accent">Birthday!</span></div>
      <div class="title-name">とりひめさんへ</div>
      <div class="title-divider"></div>
      <div class="title-body">みんなからのメッセージを<br>お届けします 💛</div>
      <div class="title-tap">タップして進む →</div>
    </div>
  </div>`;
}

function buildMessage(msg, i, total) {
  const bg = BG_THEMES[1 + (i % (BG_THEMES.length - 1))];
  const emoji = NO_IMG_EMOJIS[i % NO_IMG_EMOJIS.length];
  const photoHtml = msg.imageData
    ? `<img src="${msg.imageData}" alt="${esc(msg.name)}">`
    : `<span class="no-img-inner">${emoji}</span>`;

  return `<div class="slide" data-idx="${i+1}" data-bg="${bg}">
    <div class="slide-inner msg-slide">
      <div class="msg-counter">No. ${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
      <div class="photo-circle">${photoHtml}</div>
      <div class="msg-from">from</div>
      <div class="msg-name">${esc(msg.name)}</div>
      <div class="msg-rule"></div>
      <div class="msg-body">${esc(msg.message || '')}</div>
    </div>
  </div>`;
}

function buildClosing(total) {
  const idx = total + 1;
  return `<div class="slide" data-idx="${idx}" data-bg="bg-close">
    <div class="slide-inner closing-slide">
      <div class="closing-icon">🐦</div>
      <div class="closing-title">これからも<br>よろしくね！</div>
      <div class="closing-divider"></div>
      <div class="closing-sub">— みんなより 💛 —</div>
      <div class="closing-hearts">💛 💛 💛</div>
      <div class="closing-note">${total}件のメッセージ、受け取ってね</div>
    </div>
  </div>`;
}

// ── Navigation state ──
let current   = 0;
let slides    = [];
let totalSlides = 0;

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next >= totalSlides) {
    // Bounce arrow hint
    const arrow = dir < 0 ? 'arrowL' : 'arrowR';
    const el = document.getElementById(arrow);
    el.style.color = 'rgba(212,150,12,0.55)';
    setTimeout(() => { el.style.color = ''; }, 300);
    return;
  }
  goTo(next);
}

function goTo(idx) {
  if (idx === current && slides[idx]?.classList.contains('active')) return;
  if (slides[current]) slides[current].classList.remove('active');
  current = idx;
  if (slides[current]) slides[current].classList.add('active');

  // Background
  const bg = slides[current]?.dataset.bg || 'bg-0';
  const bgEl = document.getElementById('bg');
  bgEl.className = bg;

  // Dots + counter
  updateDots();

  // Arrow visibility
  document.getElementById('arrowL').classList.toggle('hidden', idx === 0);
  document.getElementById('arrowR').classList.toggle('hidden', idx === totalSlides - 1);
}

function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('counterText').textContent =
    `${String(current+1).padStart(2,'0')} / ${String(totalSlides).padStart(2,'0')}`;
}

// ── Swipe support ──
let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 55) navigate(dx < 0 ? 1 : -1);
}, {passive:true});

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
});

// ── Load from Firestore ──
async function loadSlideshow() {
  try {
    const snap = await getDocs(query(collection(db, 'slideshow_messages'), orderBy('order')));
    const messages = snap.docs.map(d => d.data());

    const container = document.getElementById('slides-container');

    if (messages.length === 0) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('errMsg').textContent = 'まだメッセージが公開されていません。\nエディターから「PUBLISH」してください。';
      return;
    }

    // Build HTML
    let html = buildTitle();
    messages.forEach((m, i) => { html += buildMessage(m, i, messages.length); });
    html += buildClosing(messages.length);
    container.innerHTML = html;

    // Build dots
    const dotsRow = document.getElementById('dotsRow');
    const total   = messages.length + 2; // title + msgs + closing
    const showDots = total <= 12;
    if (showDots) {
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsRow.appendChild(d);
      }
    }

    slides = Array.from(container.querySelectorAll('.slide'));
    totalSlides = slides.length;

    updateDots();
    document.getElementById('arrowL').classList.add('hidden');

    // Show slideshow
    document.getElementById('loading').style.display = 'none';
    container.style.display = 'block';

  } catch(err) {
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('errMsg').textContent = `読み込みエラー:\n${err.message}`;
  }
}

loadSlideshow();
</script>
</body>
</html>
